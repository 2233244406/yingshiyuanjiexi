<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebHomeTV 站点列表独立版</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151d31;--line:#2b3855;--text:#e8eefc;--muted:#9aabc9;--accent:#6ea8fe;--good:#69d6a5;--bad:#ff8585}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 "Microsoft YaHei",system-ui,sans-serif}.wrap{max-width:1440px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}h1{font-size:24px;margin:0}.muted,small{color:var(--muted)}.grid{display:grid;grid-template-columns:minmax(300px,900px);gap:16px;justify-content:center}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}.panel h2{font-size:17px;margin:0 0 12px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}input,textarea,select{width:100%;background:#0e1628;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;margin:5px 0 10px;font:inherit}textarea{min-height:76px;resize:vertical}button{background:#254b83;border:1px solid #3968a8;color:white;border-radius:8px;padding:9px 13px;cursor:pointer;font:inherit}button.secondary{background:#202c43;border-color:var(--line)}button:disabled{opacity:.45;cursor:not-allowed}.site{border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0}.site b{display:block}.site small{display:block;overflow-wrap:anywhere}.pill{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:1px 8px;font-size:12px;color:var(--muted);margin:4px 4px 0 0}.sitehead{display:flex;justify-content:space-between;gap:10px;align-items:start}.status{font-size:13px;margin-top:8px;overflow-wrap:anywhere}.ok{color:var(--good)}.err{color:var(--bad)}label{font-size:13px;color:var(--muted)}@media(max-width:850px){.grid{grid-template-columns:1fr}.wrap{padding:12px}}
</style></head><body><div class="wrap"><div class="top"><div><h1>WebHomeTV 站点列表</h1><div class="muted">独立提取版 · 本地运行 · 简体中文</div></div><div id="state" class="status">正在连接本地服务…</div></div>
<div class="grid"><aside><section class="panel"><h2>导入配置</h2><label>本地 JSON 配置文件</label><input id="file" type="file" accept=".json,application/json"><button id="importFile">导入本地 JSON</button><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><label>网络订阅 URL</label><input id="url" placeholder="https://订阅地址/get?token=…"><div class="row"><div><label>User-Agent</label><input id="ua" value="WebHomeTV-Windows/0.1"></div><div><label>Referer（可选）</label><input id="referer" placeholder="https://来源页面/"></div></div><label>其他请求头（JSON 对象，可留空）</label><textarea id="headers" placeholder='{"Cookie":"…","Authorization":"…"}'></textarea><button id="importUrl">读取订阅 URL</button><div id="importMsg" class="status"></div></section>
<section class="panel"><div class="sitehead"><h2>站点列表</h2><button class="secondary" id="refresh">刷新</button></div><input id="filter" placeholder="按站点名称 / key / API 搜索"><div id="sites"><div class="muted">尚未导入配置</div></div></section></aside>
</div></div>
<script>
const $=s=>document.querySelector(s);let sites=[];
async function api(path,opt={}){const r=await fetch(path,opt);let d;try{d=await r.json()}catch{d={}}if(!r.ok)throw Error(d.detail||r.statusText||'请求失败');return d}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function status(t,ok=true){$('#state').innerHTML=`<span class="${ok?'ok':'err'}">${esc(t)}</span>`}
function renderSites(){const q=$('#filter').value.trim().toLowerCase();const list=sites.filter(s=>[s.name,s.key,s.api,s.group].some(v=>String(v||'').toLowerCase().includes(q)));$('#sites').innerHTML=list.length?list.map(s=>`<div class="site"><b>${esc(s.name||s.key||'未命名站点')}</b><small>${esc(s.key||'')} · type=${esc(s.type)} · ${esc(s.api||'')}</small><span class="pill">${s.searchable===false||s.searchable===0?'搜索关闭':'可搜索'}</span>${s.group?`<span class="pill">${esc(s.group)}</span>`:''}</div>`).join(''):'<div class="muted">没有匹配的站点</div>'}
async function refreshSites(){const d=await api('/api/sites');sites=d.sites||[];renderSites();$('#state').textContent=`本地服务已连接 · ${sites.length} 个站点`}
$('#filter').addEventListener('input',renderSites);$('#refresh').onclick=()=>refreshSites().catch(e=>status(e.message,false));
$('#importFile').onclick=async()=>{const f=$('#file').files[0];if(!f)return $('#importMsg').textContent='请先选择 JSON 文件';const fd=new FormData();fd.append('file',f);try{const d=await api('/api/config/import-file',{method:'POST',body:fd});$('#importMsg').textContent=`导入成功：${d.name}，共 ${d.siteCount} 个站点`;await refreshSites()}catch(e){$('#importMsg').textContent=e.message}};
$('#importUrl').onclick=async()=>{const url=$('#url').value.trim();if(!url)return $('#importMsg').textContent='请输入订阅 URL';let headers={};try{headers=JSON.parse($('#headers').value||'{}');if(!headers||Array.isArray(headers)||typeof headers!=='object')throw Error('请求头必须是 JSON 对象')}catch(e){return $('#importMsg').textContent='请求头 JSON 格式错误：'+e.message}$('#importMsg').textContent='正在由本地服务请求订阅…';try{const d=await api('/api/config/import-url',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,userAgent:$('#ua').value,referer:$('#referer').value,headers})});$('#importMsg').textContent=`订阅读取成功：${d.name}，共 ${d.siteCount} 个站点`;await refreshSites()}catch(e){$('#importMsg').textContent='读取失败：'+e.message}};
(async()=>{try{await api('/api/health');const c=await api('/api/config/status');await refreshSites();if(!c.loaded)status('本地服务已连接，请导入配置');else status(`已载入配置：${c.name} · ${c.siteCount} 个站点`)}catch(e){status('无法连接本地服务，请先双击“启动站点列表.exe”：'+e.message,false)}})();
</script></body></html>
